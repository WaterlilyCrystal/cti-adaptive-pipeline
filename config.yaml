# LLM configuration
llm:
  runtime: ollama
  model: qwen2.5:3b-instruct-q4_K_M
  fallback_models: []
  model_min_ram_overrides:
    qwen2.5:3b-instruct-q4_K_M: 2.5
  base_url: http://localhost:11434
  num_ctx: 8192
  probe_num_ctx: 512
  temperature: 0.1
  max_retries: 2
  request_timeout_seconds: 60
  report_timeout_seconds: 25
  reasoning_timeout_seconds: 30
  probe_timeout_seconds: 45
  probe_retries: 3
  cooldown_seconds: 180

reporting:
  mode: fast
  generate_secondary_language_summary: false

resources:
  auto_tune: true
  available_ram_gb_override: 0
  reserve_ram_gb: 2

# Organization profile
org_profile:
  name: "Demo Org"
  industry: finance
  preferred_language: en
  preferred_languages: ["en", "vi"]
  public_domain: ""
  os: ["Ubuntu", "Windows Server"]
  web: ["Nginx"]
  db: ["PostgreSQL", "Redis"]
  frameworks: ["NodeJS", "React"]
  cloud: ["AWS"]
  exposed_services: ["443", "22", "VPN"]

tech_discovery:
  provider: none
  timeout: 10
  live: false

# Data sources
sources:
  # Leave RSS empty to use the default source catalog from rss_collector.py.
  rss: []
  reddit:
    # Public communities monitored by the Reddit RSS collector
    subreddits: [netsec, blueteamsec, threatintel, malware, ExploitDev, cybersecurity, InfoSecNews, reverseengineering, MalwareAnalysis, redteamsec, AskNetsec, computerforensics, bugbounty, chinatech]
    limit: 25
  telegram:
    # Public Telegram channels monitored by the Telegram collector
    channels: [
      vxunderground,        # Malware and intrusion reporting
      CyberKnow,            # Security knowledge sharing
      intel471,             # Threat intelligence discussion
      thecyberexpress,      # Security news
      breachesandleaks,     # Public breach tracking
      cveNotify,            # CVE alert stream
      malwr,                # Malware research and writeups
      arpsyndicate,         # Vulnerability and exploit discussion
      exploitorg,           # Exploit research
      breakersgen,          # Russian-language security discussion
      feixuyun,             # Chinese security research
      malwaresec            # Multilingual malware analysis
    ]
  cve:
    nvd_days_back: 3      # Initial lookback window for new CVE collection
    cisa_kev: true        # Include the CISA Known Exploited Vulnerabilities catalog

# Pipeline settings
pipeline:
  dedup_threshold: 0.90   # Cosine similarity threshold for semantic de-duplication
  min_confidence: 0.50    # Minimum score required to keep an item for analysis
  max_content_chars: 5000 # Maximum content length forwarded to the LLM layer
  ram_threshold_pct: 85   # Pause memory-intensive operations above this threshold
  phase3_max_items: 5     # Maximum items analyzed in one Phase 3 run
  phase3_stop_after_consecutive_llm_failures: 1

  # Memory-aware processing controls
  enable_semantic_dedup: false       # Faster processing path when resource limits are tight
  dedup_window_size: 50              # Only used when semantic de-duplication is enabled
  batch_processing_size: 500         # Smaller batches reduce RAM pressure but increase DB queries

# API keys (populate via .env in normal use)
api_keys:
  reddit_client_id: ""
  reddit_client_secret: ""
  twitter_bearer_token: ""
  telegram_api_id: ""
  telegram_api_hash: ""
  otx_api_key: ""
  builtwith_api_key: ""
  wappalyzer_api_key: ""

notifications:
  email: []
  slack: []
  zalo: []
