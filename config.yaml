# ── LLM ──────────────────────────────────────────────────
llm:
  runtime: ollama
  model: qwen2.5:7b-instruct-q4_K_M
  base_url: http://localhost:11434
  num_ctx: 8192
  temperature: 0.1

# ── Org Profile ──────────────────────────────────────────
org_profile:
  name: "Demo Org"
  industry: finance
  os: ["Ubuntu 22.04", "Windows Server 2022"]
  web: ["Nginx"]
  db: ["PostgreSQL", "Redis"]
  cloud: ["AWS"]
  exposed_services: ["443", "22", "VPN"]

# ── Sources ──────────────────────────────────────────────
sources:
  # RSS: Leave empty to use all 30+ multilingual sources from rss_collector.py SOURCES dict
  # Includes: English (CISA, MS, Google, Krebs), Russian (Xakep, Securelist), 
  # Chinese (FreeBuf, Seebug, Anquanke, Tencent), European (CERT-FR, CERT-Bund, etc.)
  rss: []
  reddit:
    # Multilingual subreddits (English, Chinese communities)
    subreddits: [netsec, blueteamsec, threatintel, malware, ExploitDev, cybersecurity, chinatech]
    limit: 25
  telegram:
    # Multilingual channels (English, Russian, Chinese)
    channels: [
      vxunderground,        # English - largest malware/APT channel
      CyberKnow,            # English - cyber knowledge
      intel471,             # English - intelligence discussions
      thecyberexpress,      # English - cyber news
      breachesandleaks,     # English - data breach tracking
      breakersgen,          # Russian - hacker discussions
      feixuyun,             # Chinese - security research
      malwaresec            # Multilingual - malware analysis
    ]
  cve:
    nvd_days_back: 3      # Lấy CVE mới trong 3 ngày gần nhất
    cisa_kev: true        # Luôn bật — CVE đang bị exploit thực tế

# ── Pipeline ─────────────────────────────────────────────
pipeline:
  dedup_threshold: 0.90   # Cosine similarity — trên ngưỡng này = duplicate
  min_confidence: 0.50    # Bỏ qua item dưới ngưỡng này
  max_content_chars: 5000 # Cắt content trước khi đưa vào LLM
  ram_threshold_pct: 85   # Auto-pause khi RAM vượt ngưỡng này

# ── API Keys (để trống ở đây, điền vào .env) ────────────
api_keys:
  reddit_client_id: ""
  reddit_client_secret: ""
  twitter_bearer_token: ""
  telegram_api_id: ""
  telegram_api_hash: ""
  otx_api_key: ""